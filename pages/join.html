<div class="view">
    <section class="page-head"><div class="container narrow"><h1><span class="ph-ico green"><i class='bx bx-extension'></i></span>Join RehabVerve</h1><div class="icon-points"><span><i class='bx bx-user-voice'></i>Professionals</span><span><i class='bx bx-buildings'></i>Centers</span><span><i class='bx bx-chalkboard'></i>Tutors</span><span><i class='bx bx-package'></i>Suppliers</span></div></div></section>
    <section class="container narrow mt-2">
        <div id="status"></div>
        <form class="card card-pad" id="apply" novalidate>
            <div class="steps-bar" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

            <fieldset data-step="1" class="stack" style="border:0;padding:0;margin:0">
                <legend class="step-title">1. Who are you?</legend>
                <div class="options" id="roles">
                    <label><input type="radio" name="role" value="practitioner" checked><span><i class='bx bx-user-voice'></i>Rehab professional or tutor</span></label>
                    <label><input type="radio" name="role" value="center"><span><i class='bx bx-buildings'></i>Center or mobile service</span></label>
                    <label><input type="radio" name="role" value="supplier"><span><i class='bx bx-package'></i>Supplier</span></label>
                </div>
                <div id="account-new" class="stack">
                    <p class="muted mb-0">Have an account? <button type="button" class="link-btn" data-signin>Sign in</button></p>
                    <div class="form-grid">
                        <label class="field"><span>Your full name *</span><input name="accName" autocomplete="name" maxlength="120"></label>
                        <label class="field"><span>Email *</span><input name="accEmail" type="email" autocomplete="email"></label>
                        <label class="field full"><span>Password *</span><input name="accPassword" type="password" autocomplete="new-password" minlength="6"><em>At least 6 characters</em></label>
                    </div>
                </div>
                <div id="account-signed" class="notice" hidden><i class='bx bx-user-check'></i><span>Applying as <strong id="acc-email"></strong></span></div>
            </fieldset>

            <fieldset data-step="2" hidden style="border:0;padding:0;margin:0">
                <legend class="step-title">2. Your details, fees and coverage</legend>
                <div id="pro-extra" class="form-grid mb-0">
                    <label class="field"><span>Discipline *</span><select name="category"><option value="">Choose…</option></select></label>
                    <label class="field"><span>Licence / registration number</span><input name="licenseNo" maxlength="120" placeholder="e.g. MRTB, NMCN, NCPs…"></label>
                </div>
                <div id="listing-fields"></div>
                <div id="supplier-fields" class="form-grid" hidden>
                    <label class="field full"><span>Organisation name *</span><input name="orgName" maxlength="160"></label>
                    <label class="field"><span>Phone *</span><input name="supPhone" type="tel" maxlength="40"></label>
                    <label class="field"><span>Location</span><input name="supLocation" maxlength="200"></label>
                    <label class="field full"><span>Products and services *</span><textarea name="productsOffered" rows="4" maxlength="2000"></textarea></label>
                </div>
            </fieldset>

            <fieldset data-step="3" hidden class="stack" style="border:0;padding:0;margin:0">
                <legend class="step-title">3. Documents</legend>
                <label class="field" data-for="practitioner center"><span id="doc-label">Licence or practising certificate *</span><input type="file" name="license" accept="application/pdf,image/jpeg,image/png,image/webp,.doc,.docx"><em>PDF, image or Word · 5 MB · private</em></label>
                <label class="field"><span>Profile photo or logo</span><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"><em>JPG, PNG or WebP · 3 MB</em></label>
                <label class="check"><input type="checkbox" name="terms"> I confirm these details are accurate and I agree to the <a href="#/terms" target="_blank">Terms</a> and <a href="#/privacy" target="_blank">Privacy Policy</a>.</label>
            </fieldset>

            <div class="form-msg error mt-2" hidden></div>
            <div class="form-actions">
                <button type="button" class="btn" data-back hidden><i class='bx bx-chevron-left'></i> Back</button>
                <button type="button" class="btn btn-primary" data-next>Continue <i class='bx bx-right-arrow-alt'></i></button>
            </div>
        </form>
    </section>
</div>
