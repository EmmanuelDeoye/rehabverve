<div class="view section">
    <div class="container" style="max-width:480px">
        <form class="card card-pad stack" id="reset" novalidate>
            <h1 style="font-size:1.5rem;display:flex;align-items:center;gap:12px"><span class="ph-ico"><i class='bx bx-key'></i></span>Reset password</h1>
            <label class="field"><span>Email address</span><input name="email" type="email" autocomplete="email" required></label>
            <div class="form-msg" id="msg" hidden></div>
            <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
            <p class="center mb-0"><button type="button" class="link-btn" data-signin>Back to sign in</button></p>
        </form>
    </div>
</div>
