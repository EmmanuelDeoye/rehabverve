<div class="view">
    <section class="page-head">
        <div class="container">
            <h1><span class="ph-ico"><i class='bx bx-search-alt'></i></span>Find care</h1>
        </div>
    </section>
    <section class="container mt-2">
        <form class="filter-bar" id="filters" role="search">
            <div class="filter-main">
                <label class="pill-field"><i class='bx bx-user-pin'></i><span class="sr-only">Professional</span><select name="category"><option value="">Anyone</option></select></label>
                <label class="pill-field"><i class='bx bx-map'></i><span class="sr-only">Location</span><input name="loc" placeholder="Location" autocomplete="address-level2"></label>
            </div>
            <div class="mode-pills" role="group" aria-label="How">
                <label><input type="radio" name="mode" value="" checked><span><i class='bx bx-grid-alt'></i>All</span></label>
                <label><input type="radio" name="mode" value="home"><span><i class='bx bx-car'></i>Home</span></label>
                <label><input type="radio" name="mode" value="clinic"><span><i class='bx bx-clinic'></i>Clinic</span></label>
                <label><input type="radio" name="mode" value="tele"><span><i class='bx bx-video'></i>Online</span></label>
            </div>
            <details class="more-filters" id="more-filters">
                <summary><i class='bx bx-slider-alt'></i> Filters <span class="badge badge-primary" id="filter-count" hidden></span></summary>
                <div class="filters">
                    <label class="field"><span>Max fee per session</span>
                        <span class="row" style="gap:6px;flex-wrap:nowrap"><select name="cur" style="width:96px"></select><input name="max" type="number" min="0" step="1000" placeholder="Any"></span>
                    </label>
                    <label class="field"><span>Keyword</span><input name="q" placeholder="Name or condition"></label>
                    <label class="field"><span>Country</span><select name="country"><option value="">All countries</option></select></label>
                    <label class="field"><span>Sort</span>
                        <select name="sort"><option value="match">Best match</option><option value="price">Lowest fee</option><option value="rating">Highest rated</option><option value="experience">Most experienced</option></select>
                    </label>
                    <label class="check" style="align-self:center"><input type="checkbox" name="verified"> Verified only</label>
                </div>
            </details>
        </form>
        <div class="result-bar"><span id="count" aria-live="polite">Loading…</span><button type="button" class="link-btn" id="reset"><i class='bx bx-reset'></i> Clear</button></div>
        <div class="grid" id="results"></div>
        <div class="ad-slot mt-3" data-ad-slot="directory"></div>
        <a class="promo mt-3" id="ask-wa" href="#" target="_blank" rel="noopener">
            <span class="promo-ico promo-wa"><i class='bx bxl-whatsapp'></i></span>
            <span class="promo-text"><strong>Not sure who to see?</strong><span>Ask us on WhatsApp</span></span>
            <i class='bx bx-chevron-right promo-go'></i>
        </a>
    </section>
</div>
