<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You're offline — RehabVerve</title>
  <meta name="theme-color" content="#050816">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef4ff; background: radial-gradient(800px 500px at 50% 0%, rgba(34,211,238,.18), transparent 60%), radial-gradient(700px 500px at 50% 100%, rgba(139,92,246,.16), transparent 60%), #050816; }
    .card { max-width: 420px; padding: 36px 28px; border-radius: 28px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 60px -15px rgba(0,0,0,.7); }
    .icon { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #22d3ee, #34d399); box-shadow: 0 16px 40px -10px rgba(34,211,238,.8); animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.02em; }
    p { margin: 0 0 22px; color: #b3c0dd; line-height: 1.6; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #22d3ee, #34d399); color: #04111a; font-weight: 700; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 40 40"><path d="M8 21h5.5l3-7.5 5 15 4-10h6.5" fill="none" stroke="#04111a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>You’re offline</h1>
    <p>RehabVerve needs a connection for live profiles and bookings. Pages you’ve visited are still available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
