<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Teletherapy Intake — RehabVerve</title>
    <meta name="description" content="A short, confidential intake so we can match you with the right teletherapy specialist.">
    <meta name="theme-color" content="#050816">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
</head>
<body class="page-intake">
    <div class="intake-hero">
        <span class="vv-eyebrow" data-reveal>Teletherapy intake · 2 minutes</span>
        <h1 data-split>Let’s find the right <span class="vv-gradient-text">care for you.</span></h1>
        <p data-reveal>Confidential questions that help our clinical team match you with the right specialist.</p>
    </div>

    <div class="form-app" data-reveal>
        <div class="form-header">
            <div class="urgency-badge" id="globalUrgencyBadge">
                <i class='bx bx-time-five'></i> <span id="globalTimerLabel">Limited discount</span>
            </div>
        </div>

        <div class="progress-wrapper">
            <div class="step-progress-bar" id="stepProgressFill"></div>
            <div class="step-counter" id="stepCounter">Step 1 / 7</div>
        </div>

        <div id="stepsContainer" class="steps-container"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="btn-prev" id="prevBtn" style="display: none;"><i class='bx bx-chevron-left'></i> Back</button>
            <button class="btn-next" id="nextBtn">Continue <i class='bx bx-chevron-right'></i></button>
        </div>
    </div>

    <script src="assets/js/navmodal.js"></script>
    <script src="assets/js/verve.js"></script>
    <script src="https://www.gstatic.com/firebasejs/5.5.0/firebase.js"></script>
    <script src="assets/js/configuration.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/form.js"></script>
</body>
</html>
