<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Health News — RehabVerve</title>
    <meta name="description" content="Rehabilitation, therapy and healthcare stories from the RehabVerve network.">
    <meta name="theme-color" content="#050816">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/directory.css">
    <link rel="stylesheet" href="assets/css/blogs.css">
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
</head>
<body class="page-directory">
    <main class="l-main">
        <section class="dir-hero">
            <div class="vv-container">
                <span class="vv-eyebrow" data-reveal>Health news</span>
                <h1 class="vv-title" data-split>Stories shaping <span class="vv-gradient-text">modern care.</span></h1>
                <p class="vv-lead" data-reveal>Research, guidance and real‑world insight on rehabilitation and therapy.</p>
                <div class="dir-search" role="search" data-reveal>
                    <i class='bx bx-search'></i>
                    <input type="search" id="blog-search-input" placeholder="Search stories" aria-label="Search stories" autocomplete="off">
                </div>
                <div class="dir-chips" id="category-chips" role="toolbar" aria-label="Filter by category"></div>
            </div>
        </section>

        <section class="vv-container blog-section" id="blog-section">
            <article class="blog-featured vv-card vv-tilt" id="blog-featured" tabindex="0" role="link" hidden data-flat></article>
            <div class="dir-toolbar"><p class="dir-count" id="blogs-count" aria-live="polite">Loading stories…</p></div>
            <div class="dir-grid dir-grid--wide blogs-container" id="blogs-container">
                <div class="card-skel vv-skel"></div><div class="card-skel vv-skel"></div><div class="card-skel vv-skel"></div>
            </div>
        </section>
    </main>

    <script src="assets/js/navmodal.js"></script>
    <script src="assets/js/verve.js"></script>
    <script src="https://www.gstatic.com/firebasejs/5.5.0/firebase.js"></script>
    <script src="assets/js/configuration.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/blogs.js"></script>
</body>
</html>
