<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page not found — RehabVerve</title>
  <meta name="theme-color" content="#050816">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <style>
    .nf { min-height: calc(100vh - var(--header-h) - var(--tabbar-h)); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px var(--gutter); }
    .nf-code { font-family: var(--font-display); font-weight: 800; font-size: clamp(110px, 32vw, 260px); line-height: .9; letter-spacing: -.07em; background: var(--grad-text); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: vv-shine 6s linear infinite, nf-float 5s ease-in-out infinite; filter: drop-shadow(0 20px 60px rgba(34,211,238,.35)); }
    @keyframes nf-float { 50% { transform: translateY(-12px); } }
    .nf h1 { font-size: clamp(24px, 5vw, 36px); margin: 10px 0 8px; }
    .nf p { color: var(--text-2); max-width: 460px; margin: 0 auto 26px; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .nf small { display: block; margin-top: 22px; color: var(--text-3); }
  </style>
</head>
<body class="page-404">
  <main class="nf">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1>This page drifted out of orbit.</h1>
    <p>The link may be broken or the page may have moved. Let’s get you back to care.</p>
    <div class="nf-actions">
      <a href="/" class="vv-btn vv-btn--primary vv-btn--lg"><i class='bx bx-home-alt-2'></i> Back to home</a>
      <a href="/professionals.html?category=All" class="vv-btn vv-btn--lg"><i class='bx bx-search'></i> Find a specialist</a>
    </div>
    <small>Redirecting home in <span id="countdown">8</span>s</small>
  </main>

  <script>
    // Clean URLs: /about.html -> /about (GitHub Pages serves the .html file)
    if (window.location.pathname.endsWith('.html') && window.location.pathname !== '/404.html') {
      window.location.href = window.location.pathname.slice(0, -5);
    }
    var seconds = 8, el = document.getElementById('countdown');
    var timer = setInterval(function () {
      seconds--; el.textContent = seconds;
      if (seconds <= 0) { clearInterval(timer); window.location.href = '/'; }
    }, 1000);
  </script>
  <script src="/assets/js/navmodal.js"></script>
  <script src="/assets/js/verve.js"></script>
</body>
</html>
