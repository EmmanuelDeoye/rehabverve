<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RehabVerve</title>
    <meta name="robots" content="noindex">
    <script>
        // Unknown address: open the matching screen of the app (e.g. /professionals), else "not found"
        (function () {
            var routes = {"index":"","professionals":"professionals","centers":"centers","users":"profile","teletherapy":"teletherapy","classes":"classes","class":"class","blogs":"updates","fullgist":"article","registration":"join","settings":"settings","assessment":"assessment","account":"signin","forgot-password":"forgot-password","form":"intake","privacy":"privacy","terms":"terms","admin":"admin","404":"404","home":"","profile":"profile","updates":"updates","article":"article","join":"join","signin":"signin","intake":"intake"};
            var seg = location.pathname.replace(/\/+$/, '').split('/').pop().replace(/\.html$/i, '').toLowerCase();
            var route = Object.prototype.hasOwnProperty.call(routes, seg) ? routes[seg] : '404';
            location.replace('/#/' + route + location.search);
        })();
    </script>
</head>
<body><p><a href="/">Go to RehabVerve</a></p></body>
</html>
