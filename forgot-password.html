<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Reset your password — RehabVerve</title>
    <meta name="description" content="Get a link to reset your RehabVerve password.">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body data-page="account">
<main id="main" class="section">
    <div class="container" style="max-width:480px">
        <form class="card card-pad stack" id="reset" novalidate>
            <h1 style="font-size:1.6rem">Reset your password</h1>
            <p class="muted mb-0">Enter the email you signed up with and we’ll send you a reset link.</p>
            <label class="field"><span>Email address</span><input name="email" type="email" autocomplete="email" required></label>
            <div class="form-msg" id="msg" hidden></div>
            <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
            <p class="center mb-0"><button type="button" class="link-btn" data-signin>Back to sign in</button></p>
        </form>
    </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<script defer src="assets/js/firebase-init.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('reset'), msg = document.getElementById('msg');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var email = form.email.value.trim();
            var btn = form.querySelector('[type=submit]');
            var say = function (text, ok) { msg.textContent = text; msg.className = 'form-msg ' + (ok ? 'ok' : 'error'); msg.hidden = false; };
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say('Please enter a valid email address.'); return; }
            if (!RV.fb) { say('We could not reach our servers. Please try again.'); return; }
            RV.busy(btn, true, 'Sending…');
            RV.fb.auth.sendPasswordResetEmail(email)
                // Same message whether or not the address has an account, so emails can't be probed
                .then(function () { say('If an account uses that address, a reset link is on its way. Check your inbox and spam folder.', true); form.reset(); })
                .catch(function (err) {
                    if (err.code === 'auth/user-not-found') say('If an account uses that address, a reset link is on its way. Check your inbox and spam folder.', true);
                    else say(RV.errorMessage(err));
                })
                .then(function () { RV.busy(btn, false); });
        });
    });
</script>
</body>
</html>
