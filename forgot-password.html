<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password — RehabVerve</title>
    <meta name="theme-color" content="#050816">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
    <style>
        .reset-wrap { min-height: calc(100vh - var(--header-h) - var(--tabbar-h)); display: flex; align-items: center; justify-content: center; padding: 32px var(--gutter); }
        .reset-card { width: 100%; max-width: 440px; padding: 34px 26px; border-radius: var(--r-xl); text-align: center; overflow: hidden; }
        .reset-card::before { content: ""; position: absolute; top: -140px; left: 50%; width: 320px; height: 260px; margin-left: -160px; background: radial-gradient(circle, rgba(34,211,238,.35), transparent 70%); pointer-events: none; }
        .reset-icon { position: relative; width: 70px; height: 70px; margin: 0 auto 16px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #04111a; background: var(--grad); box-shadow: 0 16px 36px -10px rgba(34,211,238,.8); }
        .reset-card h1 { font-size: 26px; margin: 0 0 8px; }
        .reset-card > p { color: var(--text-2); font-size: 15px; margin: 0 0 24px; }
        .reset-card form { text-align: left; }
        .reset-msg { margin-top: 16px; font-size: 14px; border-radius: 14px; }
        .reset-msg:empty { display: none; }
        .reset-msg.ok { padding: 12px 14px; color: #bbf7d0; background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35); }
        .reset-msg.bad { padding: 12px 14px; color: #fecaca; background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35); }
        .reset-back { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body class="page-reset">
    <main class="reset-wrap">
        <div class="reset-card vv-card" data-reveal="zoom">
            <div class="reset-icon"><i class='bx bx-key'></i></div>
            <h1>Reset your password</h1>
            <p>Enter your account email and we’ll send you a secure link to set a new password.</p>

            <form id="forgot-password-form" novalidate>
                <div class="form-group">
                    <input type="email" id="reset-email" placeholder="you@email.com" autocomplete="email" required aria-label="Email address">
                </div>
                <button type="submit" class="vv-submit" id="reset-btn">Send reset link</button>
            </form>

            <div id="message" class="reset-msg" role="status"></div>
            <a href="index.html" class="reset-back"><i class='bx bx-arrow-back'></i> Back to home</a>
        </div>
    </main>

    <script src="assets/js/navmodal.js"></script>
    <script src="assets/js/verve.js"></script>
    <script src="https://www.gstatic.com/firebasejs/5.5.0/firebase.js"></script>
    <script src="assets/js/configuration.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('reset-email').value.trim();
            var messageDiv = document.getElementById('message');
            var btn = document.getElementById('reset-btn');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                messageDiv.className = 'reset-msg bad';
                messageDiv.textContent = 'Please enter a valid email address.';
                return;
            }
            btn.disabled = true; btn.textContent = 'Sending…';

            firebase.auth().sendPasswordResetEmail(email)
                .then(function () {
                    messageDiv.className = 'reset-msg ok';
                    messageDiv.textContent = 'Reset link sent! Check your inbox (and spam folder).';
                    document.getElementById('forgot-password-form').reset();
                })
                .catch(function (error) {
                    var errorMessage = 'Error sending reset email. Please try again.';
                    switch (error.code) {
                        case 'auth/invalid-email': errorMessage = 'Invalid email address.'; break;
                        case 'auth/user-not-found': errorMessage = 'No account found with this email.'; break;
                        case 'auth/too-many-requests': errorMessage = 'Too many attempts. Please try again later.'; break;
                    }
                    messageDiv.className = 'reset-msg bad';
                    messageDiv.textContent = errorMessage;
                })
                .then(function () { btn.disabled = false; btn.textContent = 'Send reset link'; });
        });
    </script>
</body>
</html>
