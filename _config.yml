# GitHub Pages serves this repository as a static site.
# The pages are plain HTML (no Jekyll layouts); these settings only keep
# development files out of the published site.
title: RehabVerve
description: Rehabilitation care across Africa
url: "https://www.rehabverve.com.ng"

exclude:
  - README.md
  - docs
  - functions
  - tests
  - tools
  - node_modules
  - package.json
  - package-lock.json
  - firebase.json
  - database.rules.json
  - storage.rules
  - "*.log"
