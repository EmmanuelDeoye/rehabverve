<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Care Centers — RehabVerve</title>
    <meta name="description" content="Rehabilitation centers, hospitals, schools and home-care teams on the RehabVerve network.">
    <meta name="theme-color" content="#050816">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/directory.css">
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
</head>
<body class="page-directory">
    <main class="l-main">
        <section class="dir-hero">
            <div class="vv-container">
                <span class="vv-eyebrow" data-reveal>Approved centers</span>
                <h1 class="vv-title" data-split>Care centers, <span class="vv-gradient-text">closer to you.</span></h1>
                <p class="vv-lead" data-reveal>Rehabilitation centers, hospitals, schools and home‑care teams — reviewed and listed on the network.</p>
                <div class="dir-search" role="search" data-reveal>
                    <i class='bx bx-search'></i>
                    <input type="search" id="center-search-input" placeholder="Search centers by name or location" aria-label="Search centers" autocomplete="off">
                </div>
                <div class="dir-chips" id="category-chips" role="toolbar" aria-label="Filter by type"></div>
            </div>
        </section>

        <section class="vv-container">
            <div class="dir-toolbar"><p class="dir-count" id="centers-count" aria-live="polite">Loading centers…</p></div>
            <div class="dir-grid dir-grid--wide centers-container" id="centers-container">
                <div class="card-skel vv-skel"></div><div class="card-skel vv-skel"></div><div class="card-skel vv-skel"></div>
            </div>

            <div class="dir-cta" data-reveal>
                <div>
                    <h3>Run a center or clinic?</h3>
                    <p>List your facility and reach families searching for care.</p>
                </div>
                <a class="vv-btn vv-btn--primary" href="registration.html"><i class='bx bx-building'></i> Register your center</a>
            </div>
        </section>
    </main>

    <a href="assessment.html" class="floating-ai-button22" style="display: none;">
        <i class='bx bx-bot'></i>
        <span class="ai-button-text">Quick Assessment</span>
    </a>

    <script src="assets/js/navmodal.js"></script>
    <script src="assets/js/verve.js"></script>
    <script src="https://www.gstatic.com/firebasejs/5.5.0/firebase.js"></script>
    <script src="assets/js/configuration.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/centers.js"></script>
    <script src="assets/js/track.js"></script>
</body>
</html>
